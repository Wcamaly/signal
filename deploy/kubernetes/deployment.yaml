apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal
spec:
  # SQLite on a ReadWriteOnce volume: exactly one replica, and never a rolling
  # update — two pods writing the same file is data loss.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: signal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signal
    spec:
      containers:
        - name: signal
          image: signal:local
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: signal-config
            - secretRef:
                name: signal-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: signal-data
