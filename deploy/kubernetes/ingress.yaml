# Signal has no authentication of its own: anyone who reaches this host can read
# your drafts and spend your API credits. Publish it on a private network, or
# put an authenticating proxy in front of it — never on a public address as is.
#
# Set the host and the ingressClassName for your cluster, or drop this file from
# kustomization.yaml and use `kubectl port-forward` instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signal
spec:
  ingressClassName: nginx
  rules:
    - host: signal.internal.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signal
                port:
                  name: http
