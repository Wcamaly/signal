# Signal, self-hosted with Docker.
#
#   cp .env.example .env      # optional: everything can also be set in the UI
#   docker compose up -d      # http://localhost:3000
#
# State lives in the `signal-data` volume (SQLite + the credential encryption
# key). Back it up: losing it loses the digests, the posts and the keys stored
# from the UI.

services:
  signal:
    build: .
    image: signal:local
    container_name: signal
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"     # bind to the LAN only behind a proxy you trust
    environment:
      NODE_ENV: production
      PORT: "3000"
      SIGNAL_DATA_DIR: /app/data
      TZ: ${TZ:-UTC}
      # Pins the key that encrypts credentials saved from the UI. Without it a
      # random key is generated inside the volume, which is fine until you
      # restore the volume somewhere else.
      SIGNAL_SECRET_KEY: ${SIGNAL_SECRET_KEY:-}
      # Required if anything but localhost can reach /api/cron.
      CRON_SECRET: ${CRON_SECRET:-}
      # Optional: an LLM key can be pasted in the UI instead.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - signal-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Weekly run, Mondays at 08:00. Start it with:  docker compose --profile cron up -d
  # Any external scheduler works just as well — see docs/deploying.md.
  cron:
    image: alpine:3.22
    container_name: signal-cron
    restart: unless-stopped
    profiles: [cron]
    depends_on:
      - signal
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      TZ: ${TZ:-UTC}
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl tzdata >/dev/null
        printf '0 8 * * 1 curl -sS --max-time 900 -H "authorization: Bearer $$CRON_SECRET" http://signal:3000/api/cron\n' > /etc/crontabs/root
        crond -f -l 8

volumes:
  signal-data:
